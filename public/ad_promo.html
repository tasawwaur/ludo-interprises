<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Legends - Official 3D Video Ad Promo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1b0733 0%, #080112 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }
        .ad-card {
            width: 100%;
            max-width: 480px;
            background: linear-gradient(180deg, rgba(40,15,65,0.9) 0%, rgba(15,5,25,0.95) 100%);
            border: 2px solid #fbbf24;
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 0 50px rgba(251,191,36,0.3), 0 20px 40px rgba(0,0,0,0.8);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .glow-title {
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(90deg, #ffe259, #ffa751);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(255,226,89,0.5);
        }
        .tagline {
            font-size: 13px;
            color: #d8b4fe;
            margin-bottom: 20px;
        }
        .dice-box {
            font-size: 72px;
            margin: 15px 0;
            display: inline-block;
            animation: bounceDice 2s infinite ease-in-out;
        }
        @keyframes bounceDice {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-18px) rotate(180deg); }
        }
        .reward-badge {
            background: linear-gradient(90deg, #10b981, #059669);
            color: #fff;
            font-weight: 900;
            font-size: 13px;
            padding: 10px 18px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(16,185,129,0.4);
            border: 1px solid #34d399;
        }
        .cta-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #fbbf24, #f59e0b, #d97706);
            color: #000;
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 20px;
            text-decoration: none;
            box-shadow: 0 8px 25px rgba(245,158,11,0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid #fff;
        }
        .cta-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 12px 35px rgba(245,158,11,0.8);
        }
    </style>
</head>
<body>
    <div class="ad-card">
        <h1 class="glow-title">🎲 Ludo Legends</h1>
        <p class="tagline">AAA Realtime Mobile Gaming Platform</p>
        
        <div class="dice-box">🎲👑✨</div>
        
        <div>
            <div class="reward-badge">🎁 WELCOME BONUS: 20,000 COINS + 200 GEMS</div>
        </div>

        <a href="https://ludo-interprises.onrender.com" class="cta-btn">📲 DOWNLOAD & PLAY NOW</a>
    </div>
</body>
</html>
